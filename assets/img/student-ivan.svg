<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="164" cy="34" r="52" fill="#ffffff" opacity=".22"/>
  <circle cx="26" cy="172" r="62" fill="#ffffff" opacity=".16"/>

  <!-- shoulders -->
  <path d="M20 200c3-38 32-60 80-60s77 22 80 60Z" fill="#4f46e5"/>
  <path d="M86 148h28v26l-14 10-14-10Z" fill="#4338ca"/>

  <!-- neck -->
  <rect x="86" y="118" width="28" height="36" rx="14" fill="#e8b48c"/>
  <path d="M86 122c8 8 20 8 28 0v10c-8 7-20 7-28 0Z" fill="#c98f66" opacity=".45"/>

  <!-- ears -->
  <circle cx="58" cy="94" r="9" fill="#f5c9a8"/>
  <circle cx="142" cy="94" r="9" fill="#f5c9a8"/>

  <!-- head -->
  <ellipse cx="100" cy="90" rx="42" ry="46" fill="#f5c9a8"/>

  <!-- side-parted hair -->
  <path d="M57 90c-3-31 16-52 43-52 28 0 47 21 44 52-7-13-17-21-29-24-8 10-30 14-43 7-6 3-11 8-15 17Z" fill="#1e293b"/>
  <path d="M99 46c16 0 29 6 37 19-12-9-26-12-43-10Z" fill="#334155"/>

  <!-- brows -->
  <path d="M73 89q9-5 18 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <path d="M109 89q9-5 18 0" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

  <!-- eyes -->
  <circle cx="83" cy="99" r="4.5" fill="#0f172a"/>
  <circle cx="117" cy="99" r="4.5" fill="#0f172a"/>
  <circle cx="84.5" cy="97.5" r="1.4" fill="#ffffff"/>
  <circle cx="118.5" cy="97.5" r="1.4" fill="#ffffff"/>

  <!-- nose -->
  <path d="M100 101v9q-4 4-7 1" fill="none" stroke="#c98f66" stroke-width="2.5" stroke-linecap="round"/>

  <!-- smile -->
  <path d="M89 120q11 9 22 0" fill="none" stroke="#9a5b3c" stroke-width="3" stroke-linecap="round"/>
</svg>
